[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnpath-ai"
version = "1.0.0"
description = "Offline-first Python hybrid scanner for AI/agent app code: detection + path context + fix suggestions only."
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [{name = "VulnPath-AI"}]
keywords = ["security", "sast", "scanner", "ai-agent"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[tool.setuptools]
py-modules = ["analyze_hybrid"]

[project.scripts]
vulnpath-ai = "analyze_hybrid:main"
